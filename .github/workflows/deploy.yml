name: Deploy HTML to GitHub Pages

on:
  schedule:
    - cron: '0 8 20 * *'
    - cron: '0 8 21 * *'
    - cron: '0 8 22 * *'
    - cron: '0 8 23 * *'
    - cron: '0 8 24 * *'
    - cron: '0 8 25 * *'
    - cron: '0 8 26 * *'
    - cron: '0 8 27 * *'
    - cron: '0 8 28 * *'
    - cron: '0 8 29 * *'
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier si le site est déjà à jour
        id: check-update
        run: |
          # Récupère mois et année courants
          MONTH=$(date +'%m')
          YEAR=$(date +'%Y')

          # Construit une regex : Dernier point : XX/MM/YYYY (XX = 01 à 31)
          REGEX="Dernier point : [0-3][0-9]/$MONTH/$YEAR"
          echo "Regex attendue: $REGEX"

          # Récupère la page en ligne
          curl -s https://jdesclodure.github.io/quickcharts/ > page.html

          # Vérifie si elle contient une date valide du mois/année courants
          if grep -Eq "$REGEX" page.html; then
            echo "Le site est déjà à jour (date trouvée pour $MONTH/$YEAR)."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Mise à jour nécessaire."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check-update.outputs.skip != 'true'
        uses: actions/checkout@v2

      - name: Set up R
        if: steps.check-update.outputs.skip != 'true'
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        if: steps.check-update.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev pandoc libuv1-dev
        shell: bash

      - name: Install R dependencies
        if: steps.check-update.outputs.skip != 'true'
        run: |
          R -e "install.packages(c('dplyr', 'magrittr', 'plotly', 'rmarkdown', 'stringr', 'rlang', 'tidyr', 'insee'))"
        shell: bash

      - name: Install quickcharts
        if: steps.check-update.outputs.skip != 'true'
        run: |
          git clone https://github.com/jdesclodure/quickcharts.git
          R -e "install.packages('../quickcharts/', repos = NULL, type='source')"
        shell: bash

      - name: Generate HTML
        if: steps.check-update.outputs.skip != 'true'
        env:
          INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
        run: |
          R -e "quickcharts::quickCharts()"
        shell: bash

      - name: Move HTML to deployment directory
        if: steps.check-update.outputs.skip != 'true'
        run: |
          mkdir -p deploy
          cp html/conjoncture_graphiques_*.html deploy/index.html

      - name: Deploy to GitHub Pages
        if: steps.check-update.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
